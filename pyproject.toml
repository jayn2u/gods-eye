[project]
name = "gods-eye-service"
version = "0.1.0"
description = "Text-to-image person retrieval service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116,<0.117",
  "pydantic-settings>=2.10,<3",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
indexing = ["faiss-cpu>=1.9,<2"]
clip = [
  "torch>=2.4,<3",
  "transformers>=4.45,<5",
]

[project.scripts]
gods-eye-index = "gods_eye.index_store:main"
gods-eye-prepare-model = "gods_eye.clip:prepare_cache"
gods-eye-acceptance = "gods_eye.acceptance:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["service"]
testpaths = ["service/tests"]
markers = ["integration: opt-in tests that load real external model assets"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["service/gods_eye"]
