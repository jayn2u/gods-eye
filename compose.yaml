services:
  service:
    image: ${GODS_EYE_SERVICE_IMAGE:-gods-eye-service:local}
    build:
      context: .
      dockerfile: Dockerfile.service
    environment:
      GODS_EYE_DATASET_ROOT: /datasets
      GODS_EYE_INDEX_ROOT: /indexes
      GODS_EYE_ACTIVE_INDEX: /indexes/active
      GODS_EYE_HF_CACHE: /models
      GODS_EYE_BIND_HOST: 0.0.0.0
      GODS_EYE_BIND_PORT: 8000
      GODS_EYE_MODEL_ID: ${GODS_EYE_MODEL_ID:-openai/clip-vit-base-patch16}
      GODS_EYE_MODEL_REVISION: ${GODS_EYE_MODEL_REVISION:-}
      GODS_EYE_OFFLINE: ${GODS_EYE_OFFLINE:-false}
      GODS_EYE_DEVICE: ${GODS_EYE_DEVICE:-auto}
      GODS_EYE_BATCH_SIZE: ${GODS_EYE_BATCH_SIZE:-32}
      GODS_EYE_USE_FIXTURES: ${GODS_EYE_USE_FIXTURES:-false}
      GODS_EYE_LOG_LEVEL: ${GODS_EYE_LOG_LEVEL:-INFO}
    volumes:
      - ${GODS_EYE_DATASET_ROOT:-./data/datasets}:/datasets:ro
      - ${GODS_EYE_INDEX_ROOT:-./indexes}:/indexes:rw
      - ${GODS_EYE_HF_CACHE:-./.cache/huggingface}:/models:rw
    ports: ["127.0.0.1:${GODS_EYE_BIND_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
  dataset-installer:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.service
    entrypoint: ["gods-eye-datasets"]
    command: ["--data-root", "/data", "--index-root", "/indexes", "status"]
    volumes:
      - ${GODS_EYE_DATA_HOME:-./data}:/data:rw
      - ${GODS_EYE_INDEX_ROOT:-./indexes}:/indexes:rw
  launcher:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.launcher
    image: ${GODS_EYE_LAUNCHER_IMAGE:-gods-eye-launcher:local}
    environment:
      GODS_EYE_PROJECT_ROOT: /workspace
      GODS_EYE_HOST_PROJECT_ROOT: ${GODS_EYE_HOST_PROJECT_ROOT:-.}
      GODS_EYE_LAUNCHER_IMAGE: ${GODS_EYE_LAUNCHER_IMAGE:-gods-eye-launcher:local}
      GODS_EYE_HOST_COMPOSE_VERSION: ${GODS_EYE_HOST_COMPOSE_VERSION:-}
      GODS_EYE_IMAGE_MODE: ${GODS_EYE_IMAGE_MODE:-local}
      GODS_EYE_RELEASE_VERSION: ${GODS_EYE_RELEASE_VERSION:-development}
      GODS_EYE_SERVICE_IMAGE: ${GODS_EYE_SERVICE_IMAGE:-gods-eye-service:local}
      GODS_EYE_WEB_IMAGE: ${GODS_EYE_WEB_IMAGE:-gods-eye-web:local}
      GODS_EYE_COMPOSE_PROJECT_NAME: ${GODS_EYE_COMPOSE_PROJECT_NAME:-}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-}
      GODS_EYE_COMPOSE_FILE: ${GODS_EYE_COMPOSE_FILE:-/workspace/compose.yaml}
      COMPOSE_FILE: ${GODS_EYE_COMPOSE_FILE:-/workspace/compose.yaml}
    network_mode: host
    volumes:
      - ${GODS_EYE_HOST_PROJECT_ROOT:-.}:/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GODS_EYE_DOCKER_BIN:-/usr/bin/docker}:/usr/local/bin/docker:ro
      - ${GODS_EYE_DOCKER_COMPOSE_PLUGIN:-/usr/libexec/docker/cli-plugins/docker-compose}:/usr/local/lib/docker/cli-plugins/docker-compose:ro
  web:
    image: ${GODS_EYE_WEB_IMAGE:-gods-eye-web:local}
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on: [service]
    ports: ["127.0.0.1:${GODS_EYE_WEB_PORT:-5173}:80"]
