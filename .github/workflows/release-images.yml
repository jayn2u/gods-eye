name: Release container images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate semantic version tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: printf '%s\n' "$RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Verify research assets are excluded
        run: |
          test -z "$(git ls-files data indexes .cache)"
          grep -Fx data .dockerignore
          grep -Fx indexes .dockerignore
          grep -Fx .cache .dockerignore
          grep -Fx .gods-eye .dockerignore

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish service image
        id: service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.service
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jayn2u/gods-eye-service:${{ github.ref_name }}

      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jayn2u/gods-eye-web:${{ github.ref_name }}

      - name: Record immutable release configuration
        env:
          SERVICE_DIGEST: ${{ steps.service.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          printf 'GODS_EYE_RELEASE_VERSION=%s\n' "$RELEASE_VERSION" > release-images.env
          printf 'GODS_EYE_SERVICE_IMAGE=ghcr.io/jayn2u/gods-eye-service@%s\n' "$SERVICE_DIGEST" >> release-images.env
          printf 'GODS_EYE_WEB_IMAGE=ghcr.io/jayn2u/gods-eye-web@%s\n' "$WEB_DIGEST" >> release-images.env
          grep -Eq '^GODS_EYE_SERVICE_IMAGE=ghcr.io/jayn2u/gods-eye-service@sha256:[0-9a-f]{64}$' release-images.env
          grep -Eq '^GODS_EYE_WEB_IMAGE=ghcr.io/jayn2u/gods-eye-web@sha256:[0-9a-f]{64}$' release-images.env

      - name: Verify anonymous immutable pulls
        env:
          SERVICE_DIGEST: ${{ steps.service.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "ghcr.io/jayn2u/gods-eye-service@${SERVICE_DIGEST}"
          docker buildx imagetools inspect "ghcr.io/jayn2u/gods-eye-web@${WEB_DIGEST}"

      - name: Package digest-pinned release checkout
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: tar --exclude=.git --exclude="gods-eye-${RELEASE_VERSION}.tar.gz" -czf "gods-eye-${RELEASE_VERSION}.tar.gz" .

      - name: Publish release manifest and checkout
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_VERSION" >/dev/null 2>&1 || gh release create "$RELEASE_VERSION" --generate-notes
          gh release upload "$RELEASE_VERSION" release-images.env "gods-eye-${RELEASE_VERSION}.tar.gz" --clobber
