name: Agent QA Report

on:
  workflow_run:
    workflows:
      - Agent QA
    types:
      - completed

permissions: {}

jobs:
  correlate:
    name: Correlate trusted Agent QA run
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      pr_number: ${{ steps.identity.outputs.pr_number }}
    steps:
      - name: Check out immutable trusted publisher code
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-control
          persist-credentials: false

      - name: Install trusted correlation dependencies
        run: npm ci --prefix trusted-control/.github/agent-qa --omit=dev

      - name: Parse the typed trusted run identity
        id: identity
        # actions/github-script v8
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const path = require('node:path');
            const reporter = require(path.join(
              process.env.GITHUB_WORKSPACE,
              'trusted-control/.github/agent-qa/reporter.cjs',
            ));
            const run = context.payload.workflow_run;
            const repository = context.payload.repository?.full_name;
            const trustedPath = run?.path === reporter.WORKFLOW_PATH
              || (typeof run?.path === 'string' && run.path.startsWith(`${reporter.WORKFLOW_PATH}@`));
            if (
              repository !== 'jayn2u/gods-eye'
              || run?.repository?.full_name !== repository
              || run?.event !== 'pull_request_target'
              || run?.status !== 'completed'
              || !Number.isSafeInteger(run?.id)
              || run.id <= 0
              || !Number.isSafeInteger(run?.run_attempt)
              || run.run_attempt <= 0
              || !trustedPath
            ) {
              core.setFailed('Untrusted or malformed Agent QA workflow_run metadata');
              return;
            }
            const identity = reporter.parseWorkflowRunIdentity(run);
            if (!identity) {
              core.setFailed('Agent QA run name did not contain a trusted identity');
              return;
            }
            core.setOutput('pr_number', String(identity.prNumber));

  publish:
    name: Publish current advisory report
    needs: correlate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: gods-eye-agent-qa-report-pr-${{ needs.correlate.outputs.pr_number }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out immutable trusted publisher code
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-control
          persist-credentials: false

      - name: Install trusted publisher dependencies
        run: npm ci --prefix trusted-control/.github/agent-qa --omit=dev

      - name: Publish the independently verified current generation
        # actions/github-script v8
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const path = require('node:path');
            const { publishWorkflowRun } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              'trusted-control/.github/agent-qa/reporter.cjs',
            ));
            const outcome = await publishWorkflowRun({
              github,
              workflowRun: context.payload.workflow_run,
              repository: `${context.repo.owner}/${context.repo.repo}`,
            });
            core.info(`Agent QA publication: ${JSON.stringify(outcome)}`);
            if (outcome.status === 'incomplete') {
              core.setFailed(`Agent QA publication incomplete: ${outcome.reason}`);
            }
