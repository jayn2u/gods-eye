name: Tests

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  suite:
    name: Unit and integration suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the test environment
        run: uv sync --frozen --extra indexing

      - name: Run the suite
        run: uv run --extra indexing pytest -q -rs
